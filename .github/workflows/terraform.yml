name: Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository code
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Show GitHub IDs
      - name: Show GitHub IDs
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Owner ID: ${{ github.event.repository.owner.id }}"
          echo "Repository ID: ${{ github.event.repository.id }}"

      # 3. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::604842892210:role/GitHubActionsTerraformRole
          aws-region: ap-southeast-2

      # 4. Verify AWS authentication
      - name: Check AWS identity
        run: aws sts get-caller-identity

      # 5. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 6. Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # 7. Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      # 8. Create Terraform plan
      - name: Terraform Plan
        run: terraform plan
